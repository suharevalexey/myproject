[project]
name = "myproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suharevalexey", email = "suharevalexeyy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dvc>=3.67.1",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pytorch-lightning>=2.6.6",
    "requests>=2.34.2",
    "ruff>=0.17.1",
    "torch>=2.15.0",
    "ty>=0.0.89",
]

[project.scripts]
myproject = "myproject:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
invalid-argument-type = "error"
invalid-assignment = "error"
invalid-return-type = "error"

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests for individual components (block, model, dataloader)",
    "property: Property-based tests with Hypothesis",
    "smoke: Fast smoke and dry-run tests (loss finite, gradients not None)",
    "overfit: Overfit single batch convergence tests",
    "integration: Integration tests for pipeline components",
    "e2e: End-to-end pipeline execution tests",
]
